<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SplitPay</title>
    <script>
      // Applies the saved theme before first paint, so the page never flashes the wrong one.
      // Mirrors src/lib/preferences.ts (key "splitpay.theme", default "claro").
      (function () {
        var themes = { claro: "light", escuro: "dark", automatico: "auto" };
        var theme = "light";
        try {
          var saved = window.localStorage.getItem("splitpay.theme");
          if (saved && Object.prototype.hasOwnProperty.call(themes, saved)) {
            theme = themes[saved];
          }
        } catch (error) {
          // Storage blocked (private mode): keep the light default.
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
